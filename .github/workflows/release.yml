name: Release

# Cuando se fusiona a main un cambio que sube la versión en magiclobby.php,
# se crea automáticamente el Release con esa etiqueta (p. ej. v0.2.0). Ese
# Release es lo que las instalaciones detectan como "actualización disponible".

on:
  push:
    branches: [main]
    paths:
      - "magiclobby.php"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Leer la versión del plugin
        id: ver
        run: |
          V=$(grep -oiP '^\s*\*\s*Version:\s*\K[0-9][0-9.]*' magiclobby.php | head -1)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Versión detectada: $V"

      - name: ¿Ya existe el tag?
        id: check
        run: |
          if git ls-remote --tags origin "refs/tags/v${{ steps.ver.outputs.version }}" | grep -q .; then
            echo "exists=yes" >> "$GITHUB_OUTPUT"
          else
            echo "exists=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Crear el Release
        if: steps.check.outputs.exists == 'no' && steps.ver.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.ver.outputs.version }}" \
            --title "v${{ steps.ver.outputs.version }}" \
            --generate-notes
