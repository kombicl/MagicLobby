name: "💡 Proponer una mejora"
description: Una idea o funcionalidad nueva.
title: "[Idea]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: ¿Qué te gustaría que hiciera?
      placeholder: Me gustaría poder programar un contenido solo para los domingos...
    validations:
      required: true
  - type: textarea
    id: motivo
    attributes:
      label: ¿Por qué ayudaría?
    validations:
      required: false
